name: Purplle .well-known Probe
description: >-
  No .well-known document is served on any Purplle host. www.purplle.com sits behind
  a Radware Bot Manager JS challenge that answers a non-standard HTTP 247 with an
  identical 577-byte JavaScript challenge shell (the "rbzns"/"winsocks" bootstrap,
  loading /kramericaindustries.ac_v2.lib.js) for every unrecognised path. A control
  probe of a guaranteed-nonexistent path returned the same 247 status and the same
  577 bytes, so a 247 here is the challenge, not a document and not a 404.
  /.well-known/security.txt is the one exception: it returns HTTP 200 with a
  ZERO-BYTE body and content-type text/html, which is an empty response rather than
  an RFC 9116 document. api.purplle.com resolves but every path returns HTTP 502
  from the edge. developer.purplle.com and docs.purplle.com do not resolve at all.
  NO WellKnown and NO SecurityTxt pointer is emitted for this provider: nothing here
  is a hit.
