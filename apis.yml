aid: purplle
name: Purplle
description: 'Purplle is an Indian beauty and personal care e-commerce marketplace headquartered in Mumbai,
  founded in 2012 by Manish Taneja, Rahul Dash, Suyash Katyayani and Anurag Neema. The platform sells
  skincare, makeup, haircare, fragrance, bath and body, grooming, mom and baby and wellness products across
  India, carrying a catalogue of 60,000+ products from 1,000+ brands alongside its own homegrown labels
  — Good Vibes, DERMDOC, Alps Goodness, NY Bae, FACES CANADA, Carmesi, Salm Skin and Juicy Chemistry.
  Purplle became an Indian unicorn in 2022 and is backed by ADIA, Kedaara, Premji Invest, Peak XV Partners,
  Goldman Sachs, Verlinvest, JSW Ventures and Blume Ventures. It operates a consumer website and mobile
  app plus 100+ offline stores, and publishes editorial guidance through Purplle Magazine. Purplle is
  a direct-to-consumer retailer: as of this profile it publishes no public developer program, API documentation,
  or machine-readable API contract. It does publish an llms.txt at its web root describing its catalogue
  for AI agents.'
