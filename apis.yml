x-pointer-verification: 'Every www.purplle.com pointer above is taken verbatim from Purplle''s own published
  https://www.purplle.com/llms.txt, which is the provider asserting these URLs. None could be independently
  content-verified: the entire site is Angular client-rendered behind Radware Bot Manager. Unrecognised
  paths return a non-standard HTTP 247 JavaScript challenge (577 bytes), and the /pr/ route is a CATCH-ALL
  that answers HTTP 200 with a ~151KB shell and an EMPTY <link rel="canonical"> for any path, including
  the control /pr/not-a-real-page-xyz-9931. A 200 from this host is therefore not evidence a page exists,
  and no pointer here was credited on the basis of one.'
